<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xepbio (젭바이오) | Redirecting...</title>
    <meta name="robots" content="noindex">
    <script>
        (function() {
            var path = (window.location.pathname || '').toLowerCase();
            var langChoice = sessionStorage.getItem('xepbio-lang');
            var userLang = navigator.language || navigator.userLanguage || 'ko';
            var goEn = path.indexOf('en') !== -1 || langChoice === 'en' || (!langChoice && !userLang.startsWith('ko'));
            window.location.replace(goEn ? '/index_en.html' : '/');
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=/">
</head>
<body style="background:#060B19;color:#F8F9FA;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
    <p><a href="/" style="color:#00F2FE;text-decoration:none;">Xepbio 공식 홈페이지로 이동 중입니다...</a></p>
</body>
</html>
